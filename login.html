<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("jpl-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · Jersey Pattern Lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body class="auth">
<main class="auth-main">
  <form class="auth-card" id="form" novalidate>
    <p class="eyebrow" id="eyebrow">Selamat datang kembali</p>
    <h1 id="title">Masuk ke Studio</h1>
    <label class="field" id="nameWrap" hidden>Nama<input id="name" type="text" autocomplete="name" maxlength="60"></label>
    <label class="field" id="emailWrap">Email<input id="email" type="email" autocomplete="email" required></label>
    <label class="field" id="pwWrap">Password<input id="pw" type="password" autocomplete="current-password" minlength="8" required></label>
    <label class="field" id="pw2Wrap" hidden>Ulangi password<input id="pw2" type="password" autocomplete="new-password" minlength="8"></label>
    <p class="pw-hint" id="pwHint" hidden></p>
    <p class="err" id="err" role="alert"></p>
    <p class="okmsg" id="ok" role="status"></p>
    <button class="btn primary lg" type="submit" id="submit">Masuk</button>
    <button class="linkbtn" type="button" id="forgot">Lupa password?</button>
    <p class="switch" id="switch">Belum punya akun? <button class="linkbtn strong" type="button" id="toggle">Daftar gratis</button></p>
  </form>
</main>
<script type="module" src="/src/pages/login.js"></script>
</body>
</html>
